<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 安全问题验证 - 小鱼干记账本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            background: #FFF5ED;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('/static/bg_pattern.png?ver=20260617');
            background-size: cover;
            background-position: center;
        }
        .box {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 40px 36px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(255,138,128,0.12);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .box h1 { font-size: 26px; color: #FF8A80; margin-bottom: 5px; }
        .box .subtitle { color: #8D6E63; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 14px; color: #5D4037; margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #E8DDD5;
            border-radius: 16px;
            font-size: 15px;
            background: rgba(255,248,240,0.6);
            font-family: inherit;
        }
        .form-group input:focus {
            border-color: #FF8A80;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255,138,128,0.08);
        }
        .form-group input[readonly] {
            background: #F5EDE5;
            color: #5D4037;
            cursor: not-allowed;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-family: inherit;
            cursor: pointer;
            background: #FF8A80;
            color: white;
            font-weight: bold;
            transition: 0.25s;
        }
        .btn:hover { background: #FF6B5A; transform: translateY(-2px); }
        .link { margin-top: 16px; font-size: 14px; color: #8D6E63; }
        .link a { color: #FF8A80; text-decoration: none; font-weight: bold; }
        .flash {
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .flash-success { background: #B5EAD7; color: #2D6A4F; }
        .flash-danger { background: #FFB5B5; color: #8D3B3B; }
        .flash-warning { background: #FFE5A3; color: #8D6E00; }
        @media (max-width: 480px) { .box { padding: 30px 20px; width: 92%; } }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 安全问题验证</h1>
        <div class="subtitle">邮件发送失败，请回答安全问题验证身份</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>📧 邮箱</label>
                <input type="email" name="email" value="{{ email }}" readonly>
            </div>
            <div class="form-group">
                <label>🛡️ 安全问题</label>
                <input type="text" value="{{ question }}" readonly>
            </div>
            <div class="form-group">
                <label>🔑 安全答案</label>
                <input type="text" name="security_answer" placeholder="输入你的答案" required>
            </div>
            <button type="submit" class="btn">🔓 验证身份</button>
        </form>

        <div class="link">
            <a href="/login">← 返回登录</a>
        </div>
    </div>
</body>
</html>
