<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 小鱼干记账本</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-image: url('/static/bg_pattern.png?ver=20260617');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px 20px 40px 20px;
            max-width: 820px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ===== 顶部栏轻量化 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 245, 237, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left h1 {
            font-size: 24px;
            color: #FF8A80;
            letter-spacing: 1px;
        }
        .header-left .subtitle {
            color: #8D6E63;
            font-size: 13px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #8D6E63;
        }
        .header-right .user-avatar {
            background: #FF8A80;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .header-right .user-name {
            font-weight: 500;
        }
        .header-right .user-email {
            color: #B5A59A;
            font-size: 12px;
        }
        .header-right .logout-btn {
            color: #FF8A80;
            text-decoration: none;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 138, 128, 0.1);
            transition: 0.2s;
        }
        .header-right .logout-btn:hover {
            background: rgba(255, 138, 128, 0.2);
        }
        .header-right .export-btn {
            color: #5D4037;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(181, 234, 215, 0.3);
            transition: 0.2s;
            font-size: 13px;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .header-right .export-btn:hover {
            background: rgba(181, 234, 215, 0.5);
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: box-shadow 0.2s;
        }
        .card-title {
            font-weight: bold;
            color: #5D4037;
            margin-bottom: 14px;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: #FF8A80;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 138, 128, 0.2);
        }
        .btn-primary:hover {
            background: #FF6B5A;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #B5EAD7;
            color: #3D6B5A;
            box-shadow: 0 4px 12px rgba(181, 234, 215, 0.2);
        }
        .btn-success:hover {
            background: #8DD4BA;
            transform: translateY(-2px);
        }
        .btn-income {
            background: #B5EAD7;
            color: #2D6A4F;
            border: 2px solid #B5EAD7;
        }
        .btn-income:hover {
            background: #8DD4BA;
        }
        .btn-income.active {
            background: #4ECDC4;
            color: white;
            border-color: #4ECDC4;
        }
        .btn-expense {
            background: #FFD4C2;
            color: #8D4A3B;
            border: 2px solid #FFD4C2;
        }
        .btn-expense:hover {
            background: #FFBFA8;
        }
        .btn-expense.active {
            background: #FF8A80;
            color: white;
            border-color: #FF8A80;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
            border-radius: 50px;
        }

        /* ===== 统计 ===== */
        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
        }
        .stats-item {
            padding: 4px 8px;
            flex: 1;
            min-width: 70px;
        }
        .stats-item .number {
            font-size: 22px;
            font-weight: bold;
        }
        .stats-item .label {
            font-size: 12px;
            color: #8D6E63;
        }
        .stats-item.income .number {
            color: #4ECDC4;
            font-size: 20px;
        }
        .stats-item.expense .number {
            color: #FF8A80;
            font-size: 26px;
            font-weight: 900;
        }
        .stats-item.balance .number {
            color: #74B9FF;
            font-size: 24px;
            font-weight: 700;
        }

        /* ===== 预算模块 ===== */
        .budget-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }
        .budget-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #5D4037;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .budget-row .budget-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .budget-row .budget-input-group input {
            width: 90px;
            padding: 4px 10px;
            border: 2px solid #E8DDD5;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255, 248, 240, 0.6);
            transition: border 0.2s;
        }
        .budget-row .budget-input-group input:focus {
            border-color: #FF8A80;
            outline: none;
        }
        .budget-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }
        .budget-bar .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #B5EAD7, #4ECDC4);
            transition: width 0.6s;
        }
        .budget-bar .fill.warning {
            background: linear-gradient(90deg, #FFD93D, #FF8A80);
        }
        .budget-bar .fill.danger {
            background: linear-gradient(90deg, #FF8A80, #FF6B6B);
        }
        .budget-message {
            text-align: center;
            font-size: 12px;
            color: #8D6E63;
            margin-top: 6px;
        }
        .budget-used {
            font-size: 12px;
            color: #8D6E63;
        }

        /* ===== 表单两行布局 ===== */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }
        .form-row input,
        .form-row select {
            padding: 9px 14px;
            border: 2px solid #E8DDD5;
            border-radius: 14px;
            font-size: 14px;
            flex: 1;
            min-width: 80px;
            background: rgba(255, 248, 240, 0.6);
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: #FF8A80;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 138, 128, 0.08);
        }
        .form-row .btn {
            flex: 0 0 auto;
            border-radius: 50px;
        }
        .form-row .type-toggle {
            display: flex;
            gap: 4px;
            flex: 0 0 auto;
        }
        .form-row .type-toggle .btn {
            padding: 6px 16px;
            font-size: 13px;
            border-radius: 30px;
        }

        /* ===== 搜索 ===== */
        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            padding: 9px 16px;
            border: 2px solid #E8DDD5;
            border-radius: 50px;
            font-size: 14px;
            background: rgba(255, 248, 240, 0.6);
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: #FF8A80;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 138, 128, 0.08);
        }

        /* ===== 表格 ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th,
        td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        th {
            color: #8D6E63;
            font-weight: normal;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: rgba(255, 138, 128, 0.03);
        }

        /* ===== 标签 ===== */
        .tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 12px;
        }
        .tag-income {
            background: #B5EAD7;
            color: #2D6A4F;
        }
        .tag-expense {
            background: #FFD4C2;
            color: #8D4A3B;
        }
        .tag-shopping {
            background: #FFD93D;
            color: #8D7A00;
        }
        .tag-food {
            background: #FF8A80;
            color: #8D3B3B;
        }
        .tag-other {
            background: #FFB74D;
            color: #8D5A00;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #FFB5B5;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 50%;
        }
        .delete-btn:hover {
            color: #FF6B6B;
            background: rgba(255, 107, 107, 0.06);
            transform: scale(1.1);
        }

        .chart-container {
            width: 100%;
            height: 240px;
            margin-top: 4px;
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }
        .category-tag {
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 12px;
            background: rgba(245, 237, 229, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .stats-info {
            text-align: center;
            color: #8D6E63;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            padding: 28px 0;
            color: #B5A59A;
            font-size: 16px;
        }
        .empty-state .big-emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            font-size: 15px;
            color: #5D4037;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            body {
                padding: 12px 12px 30px 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 12px 16px;
            }
            .header-left h1 {
                font-size: 20px;
            }
            .header-left .subtitle {
                font-size: 12px;
            }
            .header-right {
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .card {
                padding: 16px;
                margin-bottom: 18px;
                border-radius: 16px;
            }
            .stats-item .number {
                font-size: 18px;
            }
            .stats-item.expense .number {
                font-size: 22px;
            }
            .stats-item.balance .number {
                font-size: 20px;
            }
            .form-row {
                flex-direction: column;
            }
            .form-row .btn {
                width: 100%;
            }
            .form-row .type-toggle {
                width: 100%;
                justify-content: center;
            }
            table {
                font-size: 12px;
            }
            th,
            td {
                padding: 6px 3px;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-group .btn {
                width: 100%;
                text-align: center;
            }
            .chart-container {
                height: 180px;
            }
            .budget-row {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .budget-row .budget-input-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Toast 提示 ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 顶部栏 ===== -->
    <div class="header">
        <div class="header-left">
            <h1>🐱 小鱼干记账本</h1>
            <span class="subtitle">🌸 好好记账</span>
        </div>
        <div class="header-right">
            <span class="user-avatar">{{ username[0]|upper }}</span>
            <span class="user-name">{{ username }}</span>
            <span class="user-email">{{ email }}</span>
            <button class="export-btn" onclick="exportExcel()">📤 导出</button>
            <a href="/logout" class="logout-btn">🚪 退出</a>
        </div>
    </div>

    <!-- ===== 统计卡片 ===== -->
    <div class="card">
        <div class="btn-group">
            <button class="btn btn-primary" id="btnMonthly" onclick="switchStats('monthly')">📊 月度</button>
            <button class="btn btn-success" id="btnWeekly" onclick="switchStats('weekly')">📅 周度</button>
        </div>

        <div class="stats" id="stats">
            <div class="stats-item income">
                <div class="number" id="income">暂无收入</div>
                <div class="label">💰 收入</div>
            </div>
            <div class="stats-item expense">
                <div class="number" id="expense">¥0</div>
                <div class="label">💸 支出</div>
            </div>
            <div class="stats-item balance">
                <div class="number" id="balance">¥0</div>
                <div class="label">📊 结余</div>
            </div>
        </div>

        <div class="stats-info" id="statsInfo">📆 本月统计</div>
        <div class="chart-container" id="pieChart"></div>
        <div class="category-tags" id="categoryStats"></div>

        <!-- 预算模块 -->
        <div class="budget-section" id="budgetSection">
            <div class="budget-row">
                <span>📋 本月预算</span>
                <div class="budget-input-group">
                    <span style="font-size:13px;color:#8D6E63;">¥</span>
                    <input type="number" id="budgetInput" value="2000" min="0" step="100">
                    <button class="btn btn-primary btn-sm" onclick="saveBudget()">💾 保存</button>
                </div>
            </div>
            <div class="budget-row">
                <span class="budget-used" id="budgetUsedText">已用 ¥0</span>
                <span class="budget-used" id="budgetRemainText">剩余 ¥2000</span>
            </div>
            <div class="budget-bar">
                <div class="fill" id="budgetFill" style="width:0%"></div>
            </div>
            <div class="budget-message" id="budgetMessage">
                💡 设置预算，更好管理支出
            </div>
        </div>
    </div>

    <!-- ===== 记一笔 ===== -->
    <div class="card">
        <div class="card-title">✏️ 记一笔</div>
        <div class="form-row">
            <input type="date" id="date">
            <input type="text" id="category" placeholder="📂 输入或选择类别" list="categoryList" style="flex:1.2;">
            <datalist id="categoryList">
                <option value="🍜 餐饮">
                <option value="🚌 交通">
                <option value="🛍️ 购物">
                <option value="💰 工资">
                <option value="🎮 娱乐">
                <option value="🏠 居家">
                <option value="其他">
            </datalist>
            <input type="number" id="amount" placeholder="金额" step="0.01">
        </div>
        <div class="form-row">
            <input type="text" id="note" placeholder="备注" style="flex:1.5;">
            <div class="type-toggle">
                <button class="btn btn-expense active" id="btnExpense" onclick="setType('支出')">💸 支出</button>
                <button class="btn btn-income" id="btnIncome" onclick="setType('收入')">💎 收入</button>
            </div>
            <button class="btn btn-primary" onclick="addRecord()">🎀 记好了！</button>
        </div>
    </div>

    <!-- ===== 搜索 ===== -->
    <div class="card">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索备注..." oninput="searchRecords()">
            <button class="btn btn-success btn-sm" onclick="loadRecords()">📋 全部</button>
        </div>
    </div>

    <!-- ===== 记账本 ===== -->
    <div class="card">
        <div class="card-title">📒 记账本</div>
        <table>
            <thead>
                <tr><th>日期</th><th>类别</th><th>金额</th><th>备注</th><th>类型</th><th></th></tr>
            </thead>
            <tbody id="recordList"></tbody>
        </table>
    </div>

    <script>
        // ===== 全局变量 =====
        let currentStats = 'monthly';
        let pieChartInstance = null;
        let currentType = '支出';
        let budgetAmount = 2000;

        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // ===== Toast 提示 =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===== 切换收入/支出 =====
        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btnExpense');
            const btnIncome = document.getElementById('btnIncome');
            if (type === '支出') {
                btnExpense.className = 'btn btn-expense active';
                btnIncome.className = 'btn btn-income';
            } else {
                btnExpense.className = 'btn btn-expense';
                btnIncome.className = 'btn btn-income active';
            }
        }

        // ===== 切换统计 =====
        function switchStats(type) {
            currentStats = type;
            document.getElementById('btnMonthly').className = type === 'monthly' ? 'btn btn-primary' : 'btn btn-success';
            document.getElementById('btnWeekly').className = type === 'weekly' ? 'btn btn-primary' : 'btn btn-success';
            loadStats();
        }

        // ===== 加载统计（修复周度数据） =====
        function loadStats() {
            const url = currentStats === 'monthly' ? '/api/monthly_stats' : '/api/weekly_stats';
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    let categories = data.categories || {};
                    let totalExpense = 0;
                    let totalIncome = data.income || 0;

                    // 修复周度数据：从 records 里计算
                    if (currentStats === 'weekly' && data.records) {
                        const catMap = {};
                        data.records.forEach(r => {
                            if (r.type === '支出') {
                                catMap[r.category] = (catMap[r.category] || 0) + r.amount;
                            }
                            if (r.type === '收入') {
                                totalIncome += r.amount;
                            }
                        });
                        categories = catMap;
                        totalExpense = Object.values(catMap).reduce((a, b) => a + b, 0);
                    } else {
                        totalExpense = Object.values(categories).reduce((a, b) => a + b, 0);
                    }

                    // 更新显示
                    document.getElementById('income').textContent = totalIncome > 0 ? '¥' + totalIncome.toFixed(0) : '暂无收入';
                    document.getElementById('expense').textContent = '¥' + totalExpense.toFixed(0);
                    document.getElementById('balance').textContent = '¥' + (totalIncome - totalExpense).toFixed(0);

                    // 结余提示
                    const balance = totalIncome - totalExpense;
                    if (balance < 0) {
                        document.getElementById('balance').style.color = '#FF6B6B';
                    } else {
                        document.getElementById('balance').style.color = '#4ECDC4';
                    }

                    // 统计信息
                    const info = document.getElementById('statsInfo');
                    if (currentStats === 'monthly') {
                        info.textContent = `📆 ${data.year}年${data.month}月 统计`;
                    } else {
                        info.textContent = `📅 ${data.start} ~ ${data.end} 统计`;
                    }

                    // 分类标签
                    const catDiv = document.getElementById('categoryStats');
                    const entries = Object.entries(categories);
                    if (entries.length > 0) {
                        catDiv.innerHTML = entries
                            .map(([cat, amount]) => {
                                let tagClass = 'category-tag';
                                if (cat.includes('购物')) tagClass += ' tag-shopping';
                                else if (cat.includes('餐饮')) tagClass += ' tag-food';
                                else tagClass += ' tag-other';
                                return `<span class="${tagClass}">${cat} ¥${amount.toFixed(0)}</span>`;
                            }).join('');
                    } else {
                        catDiv.innerHTML = '<span style="color:#B5A59A;font-size:13px;">暂无分类数据</span>';
                    }

                    // 更新饼图
                    updatePieChart(categories, totalExpense);

                    // 更新预算
                    updateBudgetDisplay();
                });
        }

        // ===== 饼图 =====
        function updatePieChart(categories, totalExpense) {
            const chartDom = document.getElementById('pieChart');
            if (!pieChartInstance) {
                pieChartInstance = echarts.init(chartDom);
            }

            const entries = Object.entries(categories);
            let chartData = [];
            let hasData = false;

            if (entries.length > 0 && totalExpense > 0) {
                hasData = true;
                chartData = entries.map(([name, value]) => ({ name, value: Math.round(value * 100) / 100 }));
            } else {
                chartData = [{ name: '暂无数据', value: 1 }];
            }

            const colorMap = {
                '购物': '#FFD93D',
                '餐饮': '#FF8A80',
                '其他': '#FFB74D',
                '交通': '#74B9FF',
                '工资': '#55EFC4',
                '娱乐': '#A29BFE',
                '居家': '#FDCB6E'
            };
            const pieColors = chartData.map(item => colorMap[item.name] || '#D5C4B5');

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: ¥{c} ({d}%)'
                },
                legend: {
                    orient: 'horizontal',
                    left: 'center',
                    top: 'bottom',
                    textStyle: { fontSize: 12, fontFamily: 'ZCOOL KuaiLe, Comic Sans MS, cursive', color: '#5D4037' },
                    itemWidth: 12,
                    itemHeight: 12,
                    itemGap: 8
                },
                color: pieColors,
                series: [{
                    type: 'pie',
                    radius: ['42%', '72%'],
                    center: ['50%', '44%'],
                    avoidLabelOverlap: true,
                    itemStyle: { borderRadius: 10, borderColor: 'rgba(255,255,255,0.6)', borderWidth: 3 },
                    label: {
                        fontSize: 12,
                        fontWeight: 'bold',
                        fontFamily: 'ZCOOL KuaiLe, Comic Sans MS, cursive',
                        color: '#5D4037',
                        formatter: '{b}\n{d}%'
                    },
                    labelLine: { length: 10, length2: 12 },
                    emphasis: { scale: true, scaleSize: 6 },
                    data: chartData
                }],
                graphic: [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: hasData ? `总支出\n¥${totalExpense.toFixed(0)}` : '🐱 暂无记录',
                        fontSize: hasData ? 17 : 15,
                        fontWeight: 'bold',
                        fontFamily: 'ZCOOL KuaiLe, Comic Sans MS, cursive',
                        fill: hasData ? '#5D4037' : '#B5A59A',
                        textAlign: 'center',
                        lineHeight: 26
                    }
                }]
            };

            pieChartInstance.setOption(option, true);
            pieChartInstance.resize();
        }

        // ===== 记录列表 =====
        function loadRecords() {
            fetch('/api/records')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('recordList');
                    tbody.innerHTML = '';
                    if (data.length === 0) {
                        tbody.innerHTML =
                            `<tr><td colspan="6"><div class="empty-state"><span class="big-emoji">😿</span>还没有记录哦~ 记一笔吧 🐱</div></td></tr>`;
                        return;
                    }
                    data.forEach(r => {
                        const tr = document.createElement('tr');
                        const typeClass = r.type === '收入' ? 'tag-income' : 'tag-expense';
                        let catClass = '';
                        if (r.category.includes('购物')) catClass = 'tag-shopping';
                        else if (r.category.includes('餐饮')) catClass = 'tag-food';
                        else catClass = 'tag-other';
                        tr.innerHTML = `
                            <td>${r.date}</td>
                            <td><span class="tag ${catClass}">${r.category}</span></td>
                            <td>¥${r.amount.toFixed(2)}</td>
                            <td>${r.note || ''}</td>
                            <td><span class="tag ${typeClass}">${r.type}</span></td>
                            <td><button class="delete-btn" onclick="deleteRecord(${r.id})">✕</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
            loadStats();
        }

        // ===== 添加记录 =====
        function addRecord() {
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value.trim();
            const type = currentType;

            if (!date) { showToast('😿 请选择日期哦'); return; }
            if (!category) { showToast('😿 请输入或选择类别哦'); return; }
            if (!amount || amount <= 0) { showToast('😿 请输入正确的金额哦'); return; }

            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, category, amount, note, type })
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById('amount').value = '';
                document.getElementById('note').value = '';
                document.getElementById('category').value = '';
                showToast('🐱 小鱼干已帮你收好这笔账单 ✨');
                loadRecords();
            });
        }

        // ===== 删除记录 =====
        function deleteRecord(id) {
            if (confirm('😿 真的要删掉这条小鱼干记录吗？')) {
                fetch('/api/delete/' + id, { method: 'DELETE' })
                    .then(() => {
                        showToast('🗑️ 已删除');
                        loadRecords();
                    });
            }
        }

        // ===== 搜索 =====
        function searchRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            fetch('/api/records')
                .then(res => res.json())
                .then(data => {
                    const filtered = data.filter(r => r.note && r.note.toLowerCase().includes(keyword));
                    const tbody = document.getElementById('recordList');
                    tbody.innerHTML = '';
                    if (filtered.length === 0) {
                        tbody.innerHTML =
                            `<tr><td colspan="6"><div class="empty-state"><span class="big-emoji">🔍</span>没有找到匹配的记录~</div></td></tr>`;
                        return;
                    }
                    filtered.forEach(r => {
                        const tr = document.createElement('tr');
                        const typeClass = r.type === '收入' ? 'tag-income' : 'tag-expense';
                        let catClass = '';
                        if (r.category.includes('购物')) catClass = 'tag-shopping';
                        else if (r.category.includes('餐饮')) catClass = 'tag-food';
                        else catClass = 'tag-other';
                        tr.innerHTML = `
                            <td>${r.date}</td>
                            <td><span class="tag ${catClass}">${r.category}</span></td>
                            <td>¥${r.amount.toFixed(2)}</td>
                            <td>${r.note || ''}</td>
                            <td><span class="tag ${typeClass}">${r.type}</span></td>
                            <td><button class="delete-btn" onclick="deleteRecord(${r.id})">✕</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        // ===== 导出 Excel =====
        function exportExcel() {
            showToast('📤 正在生成导出文件...');
            window.location.href = '/api/export_excel';
        }

        // ===== 预算相关 =====
        function loadBudget() {
            const saved = localStorage.getItem('catbook_budget');
            if (saved) {
                budgetAmount = parseFloat(saved);
                document.getElementById('budgetInput').value = budgetAmount;
            }
            updateBudgetDisplay();
        }

        function saveBudget() {
            const val = parseFloat(document.getElementById('budgetInput').value);
            if (!val || val <= 0) {
                showToast('😿 请输入有效的预算金额');
                return;
            }
            budgetAmount = val;
            localStorage.setItem('catbook_budget', String(val));
            showToast('🎀 预算已更新为 ¥' + val.toFixed(0));
            updateBudgetDisplay();
        }

        function updateBudgetDisplay() {
            const expenseText = document.getElementById('expense').textContent;
            const expense = parseFloat(expenseText.replace('¥', '')) || 0;

            const percent = Math.min((expense / budgetAmount) * 100, 100);
            document.getElementById('budgetUsedText').textContent = '已用 ¥' + expense.toFixed(0);
            document.getElementById('budgetRemainText').textContent = '剩余 ¥' + Math.max(budgetAmount - expense, 0).toFixed(0);

            const fill = document.getElementById('budgetFill');
            fill.style.width = percent + '%';
            fill.className = 'fill';
            if (percent > 90) fill.classList.add('danger');
            else if (percent > 70) fill.classList.add('warning');

            const msg = document.getElementById('budgetMessage');
            if (expense > budgetAmount) {
                msg.textContent = '⚠️ 已超出本月预算，注意控制开销';
                msg.style.color = '#FF6B6B';
            } else if (expense > budgetAmount * 0.7) {
                msg.textContent = '📌 预算已使用 ' + percent.toFixed(0) + '%，注意余量';
                msg.style.color = '#FFB74D';
            } else {
                msg.textContent = '✅ 预算余量充足，继续保持';
                msg.style.color = '#4ECDC4';
            }
        }

        // ===== 窗口自适应 =====
        window.addEventListener('resize', () => {
            if (pieChartInstance) pieChartInstance.resize();
        });

        // ===== 加载数据 =====
        loadRecords();
        loadBudget();
    </script>
</body>
</html>
