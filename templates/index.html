<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 小鱼干记账本</title>
    <!-- 引入 ECharts 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <!-- 引入圆体字体 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-image: url('/bg_pattern.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px 0 10px 0;
            background: rgba(255, 245, 237, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 30px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .header h1 {
            font-size: 32px;
            color: #FF8A80;
            letter-spacing: 2px;
        }
        .header .subtitle {
            color: #8D6E63;
            font-size: 16px;
            margin-top: 4px;
        }
        .header .user-info {
            margin-top: 10px;
            font-size: 14px;
            color: #8D6E63;
        }
        .header .user-info a {
            color: #FF8A80;
            text-decoration: none;
            margin-left: 12px;
            font-weight: bold;
        }
        .card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 22px 24px;
            margin-bottom: 18px;
            box-shadow: 0 8px 32px rgba(255, 138, 128, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .card-title {
            font-weight: bold;
            color: #5D4037;
            margin-bottom: 14px;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: #FF8A80;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 138, 128, 0.3);
        }
        .btn-primary:hover {
            background: #FF6B5A;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 138, 128, 0.4);
        }
        .btn-success {
            background: #B5EAD7;
            color: #3D6B5A;
            box-shadow: 0 4px 12px rgba(181, 234, 215, 0.3);
        }
        .btn-success:hover {
            background: #8DD4BA;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: #8D6E63;
            border: 2px solid #E8DDD5;
        }
        .btn-outline:hover {
            background: #F5EDE5;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stats-item {
            padding: 6px 12px;
            flex: 1;
            min-width: 80px;
        }
        .stats-item .number {
            font-size: 26px;
            font-weight: bold;
            color: #5D4037;
        }
        .stats-item .label {
            font-size: 13px;
            color: #8D6E63;
        }
        .stats-item.income .number { color: #4ECDC4; }
        .stats-item.expense .number { color: #FF8A80; }
        .stats-info {
            text-align: center;
            color: #8D6E63;
            font-size: 15px;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .form-row input, .form-row select {
            padding: 10px 14px;
            border: 2px solid #E8DDD5;
            border-radius: 16px;
            font-size: 15px;
            flex: 1;
            min-width: 90px;
            background: #FFF8F0;
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            transition: border 0.2s;
        }
        .form-row input:focus, .form-row select:focus {
            border-color: #FF8A80;
            outline: none;
        }
        .form-row .btn {
            flex: 0 0 auto;
        }
        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #E8DDD5;
            border-radius: 50px;
            font-size: 15px;
            background: #FFF8F0;
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
        }
        .search-box input:focus {
            border-color: #FF8A80;
            outline: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th, td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        th {
            color: #8D6E63;
            font-weight: normal;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 13px;
            background: #F5EDE5;
        }
        .tag-income { background: #B5EAD7; color: #2D6A4F; }
        .tag-expense { background: #FFD4C2; color: #8D4A3B; }
        .delete-btn {
            background: none;
            border: none;
            color: #FFB5B5;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }
        .delete-btn:hover { color: #FF6B6B; transform: scale(1.2); }
        .chart-container {
            width: 100%;
            height: 260px;
            margin-top: 6px;
        }
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .category-tag {
            background: rgba(245, 237, 229, 0.8);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 14px;
        }
        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #B5A59A;
            font-size: 18px;
        }
        .empty-state .big-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .stats { flex-wrap: wrap; }
            .form-row { flex-direction: column; }
            .form-row .btn { width: 100%; }
            table { font-size: 13px; }
            th, td { padding: 8px 4px; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; text-align: center; }
            .card { padding: 16px; }
            .chart-container { height: 200px; }
        }
    </style>
</head>
<body>

    <!-- ===== 头部 ===== -->
    <div class="header">
        <h1>🐱 小鱼干记账本</h1>
        <div class="subtitle">🌸 今天也要好好记账哦 🌸</div>
        <div class="user-info">
            👤 {{ username }}
            <span style="color:#D5C4B5; margin:0 8px;">|</span>
            📧 {{ email }}
            <a href="/logout">🚪 退出</a>
        </div>
    </div>

    <!-- ===== 统计卡片 ===== -->
    <div class="card">
        <div class="btn-group">
            <button class="btn btn-primary" id="btnMonthly" onclick="switchStats('monthly')">📊 月度</button>
            <button class="btn btn-success" id="btnWeekly" onclick="switchStats('weekly')">📅 周度</button>
        </div>

        <div class="stats" id="stats">
            <div class="stats-item income">
                <div class="number" id="income">¥0</div>
                <div class="label">💰 收入</div>
            </div>
            <div class="stats-item expense">
                <div class="number" id="expense">¥0</div>
                <div class="label">💸 支出</div>
            </div>
            <div class="stats-item">
                <div class="number" id="balance">¥0</div>
                <div class="label">📊 结余</div>
            </div>
        </div>

        <div class="stats-info" id="statsInfo">📆 本月统计</div>

        <!-- 饼图 -->
        <div class="chart-container" id="pieChart"></div>

        <div class="category-tags" id="categoryStats"></div>
    </div>

    <!-- ===== 记一笔 ===== -->
    <div class="card">
        <div class="card-title">✏️ 记一笔</div>
        <div class="form-row">
            <input type="date" id="date">
            <input type="text" id="category" placeholder="📂 输入或选择类别" list="categoryList" style="flex:1.2;">
            <datalist id="categoryList">
                <option value="🍜 餐饮">
                <option value="🚌 交通">
                <option value="🛍️ 购物">
                <option value="💰 工资">
                <option value="🎮 娱乐">
                <option value="🏠 居家">
                <option value="其他">
            </datalist>
            <input type="number" id="amount" placeholder="金额" step="0.01">
            <input type="text" id="note" placeholder="备注">
            <select id="type">
                <option value="支出">💸 支出</option>
                <option value="收入">💎 收入</option>
            </select>
            <button class="btn btn-primary" onclick="addRecord()">🎀 记好了！</button>
        </div>
    </div>

    <!-- ===== 搜索 ===== -->
    <div class="card">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索备注..." oninput="searchRecords()">
            <button class="btn btn-success btn-sm" onclick="loadRecords()">📋 全部</button>
        </div>
    </div>

    <!-- ===== 记账本 ===== -->
    <div class="card">
        <div class="card-title">📒 记账本</div>
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>类别</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>类型</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="recordList"></tbody>
        </table>
    </div>

    <script>
        let currentStats = 'monthly';
        let pieChartInstance = null;

        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        function switchStats(type) {
            currentStats = type;
            document.getElementById('btnMonthly').className = type === 'monthly' ? 'btn btn-primary' : 'btn btn-success';
            document.getElementById('btnWeekly').className = type === 'weekly' ? 'btn btn-primary' : 'btn btn-success';
            loadStats();
        }

        function loadStats() {
            const url = currentStats === 'monthly' ? '/api/monthly_stats' : '/api/weekly_stats';
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('income').textContent = '¥' + data.income.toFixed(0);
                    document.getElementById('expense').textContent = '¥' + data.expense.toFixed(0);
                    document.getElementById('balance').textContent = '¥' + data.balance.toFixed(0);

                    const info = document.getElementById('statsInfo');
                    if (currentStats === 'monthly') {
                        info.textContent = `📆 ${data.year}年${data.month}月 统计`;
                    } else {
                        info.textContent = `📅 ${data.start} ~ ${data.end} 统计`;
                    }

                    const catDiv = document.getElementById('categoryStats');
                    if (currentStats === 'monthly' && data.categories) {
                        const entries = Object.entries(data.categories);
                        if (entries.length > 0) {
                            catDiv.innerHTML = entries
                                .map(([cat, amount]) =>
                                    `<span class="category-tag">${cat} ¥${amount.toFixed(0)}</span>`
                                ).join('');
                        } else {
                            catDiv.innerHTML = '<span style="color:#B5A59A;">暂无分类数据</span>';
                        }
                    } else {
                        catDiv.innerHTML = '';
                    }

                    updatePieChart(data.categories || {});
                });
        }

        function updatePieChart(categories) {
            const chartDom = document.getElementById('pieChart');
            if (!pieChartInstance) {
                pieChartInstance = echarts.init(chartDom);
            }

            const entries = Object.entries(categories);
            let chartData = [];
            if (entries.length === 0) {
                chartData = [{ name: '暂无数据', value: 1 }];
            } else {
                chartData = entries.map(([name, value]) => ({ name, value: Math.round(value * 100) / 100 }));
            }

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: ¥{c} ({d}%)'
                },
                legend: {
                    orient: 'horizontal',
                    left: 'center',
                    top: 'bottom',
                    textStyle: {
                        fontSize: 13,
                        fontFamily: 'ZCOOL KuaiLe, Comic Sans MS, cursive',
                        color: '#5D4037'
                    },
                    itemWidth: 14,
                    itemHeight: 14,
                    borderRadius: 7
                },
                color: ['#FF8A80', '#FFD4B8', '#FFE5A3', '#B5EAD7', '#A8D8EA', '#AA96DA', '#FCBAD3', '#D4F0C0', '#FFC8DD'],
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['50%', '42%'],
                    avoidLabelOverlap: true,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#FFF8F0',
                        borderWidth: 3
                    },
                    label: {
                        fontSize: 14,
                        fontWeight: 'bold',
                        fontFamily: 'ZCOOL KuaiLe, Comic Sans MS, cursive',
                        color: '#5D4037',
                        formatter: '{b}\n{d}%'
                    },
                    labelLine: {
                        length: 12,
                        length2: 16
                    },
                    emphasis: {
                        scale: true,
                        scaleSize: 6
                    },
                    data: chartData
                }],
                graphic: entries.length === 0 ? [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: '🐱 还没有记录哦',
                        fontSize: 18,
                        fontFamily: 'ZCOOL KuaiLe, Comic Sans MS, cursive',
                        fill: '#B5A59A'
                    }
                }] : []
            };

            pieChartInstance.setOption(option, true);
            pieChartInstance.resize();
        }

        function loadRecords() {
            fetch('/api/records')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('recordList');
                    tbody.innerHTML = '';
                    if (data.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6">
                                    <div class="empty-state">
                                        <span class="big-emoji">😿</span>
                                        还没有记录哦~ 记一笔吧 🐱
                                    </div>
                                </td>
                            </tr>
                        `;
                        return;
                    }
                    data.forEach(r => {
                        const tr = document.createElement('tr');
                        const typeClass = r.type === '收入' ? 'tag-income' : 'tag-expense';
                        tr.innerHTML = `
                            <td>${r.date}</td>
                            <td>${r.category}</td>
                            <td>¥${r.amount.toFixed(2)}</td>
                            <td>${r.note || ''}</td>
                            <td><span class="tag ${typeClass}">${r.type}</span></td>
                            <td><button class="delete-btn" onclick="deleteRecord(${r.id})">✕</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
            loadStats();
        }

        function addRecord() {
            const date = document.getElementById('date').value;
            const category = document.getElementById('category').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value.trim();
            const type = document.getElementById('type').value;

            if (!date) {
                alert('请选择日期哦 🐱');
                return;
            }
            if (!category) {
                alert('请输入或选择类别哦 🐱');
                return;
            }
            if (!amount || amount <= 0) {
                alert('请输入正确的金额哦 🐱');
                return;
            }

            const data = { date, category, amount, note, type };
            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById('amount').value = '';
                document.getElementById('note').value = '';
                document.getElementById('category').value = '';
                loadRecords();
            });
        }

        function deleteRecord(id) {
            if (confirm('😿 真的要删掉这条小鱼干记录吗？')) {
                fetch('/api/delete/' + id, { method: 'DELETE' })
                    .then(() => loadRecords());
            }
        }

        function searchRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            fetch('/api/records')
                .then(res => res.json())
                .then(data => {
                    const filtered = data.filter(r =>
                        r.note && r.note.toLowerCase().includes(keyword)
                    );
                    const tbody = document.getElementById('recordList');
                    tbody.innerHTML = '';
                    if (filtered.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6">
                                    <div class="empty-state">
                                        <span class="big-emoji">🔍</span>
                                        没有找到匹配的记录~
                                    </div>
                                </td>
                            </tr>
                        `;
                        return;
                    }
                    filtered.forEach(r => {
                        const tr = document.createElement('tr');
                        const typeClass = r.type === '收入' ? 'tag-income' : 'tag-expense';
                        tr.innerHTML = `
                            <td>${r.date}</td>
                            <td>${r.category}</td>
                            <td>¥${r.amount.toFixed(2)}</td>
                            <td>${r.note || ''}</td>
                            <td><span class="tag ${typeClass}">${r.type}</span></td>
                            <td><button class="delete-btn" onclick="deleteRecord(${r.id})">✕</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        window.addEventListener('resize', () => {
            if (pieChartInstance) {
                pieChartInstance.resize();
            }
        });

        loadRecords();
    </script>
</body>
</html>
