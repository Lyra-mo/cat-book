<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 登录 - 小鱼干记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background: #FFF5ED;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('/static/bg_pattern.png?ver=20260617');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 40px 36px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(255, 138, 128, 0.12);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .login-box h1 {
            font-size: 28px;
            color: #FF8A80;
            margin-bottom: 5px;
        }
        .login-box .subtitle {
            color: #8D6E63;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #5D4037;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #E8DDD5;
            border-radius: 16px;
            font-size: 15px;
            background: rgba(255, 248, 240, 0.6);
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            transition: border 0.2s;
        }
        .form-group input:focus {
            border-color: #FF8A80;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 138, 128, 0.08);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            cursor: pointer;
            background: #FF8A80;
            color: white;
            font-weight: bold;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(255, 138, 128, 0.2);
        }
        .btn:hover {
            background: #FF6B5A;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 138, 128, 0.3);
        }
        .register-link {
            margin-top: 16px;
            font-size: 14px;
            color: #8D6E63;
        }
        .register-link a {
            color: #FF8A80;
            text-decoration: none;
            font-weight: bold;
        }
        .forgot-link {
            text-align: right;
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .forgot-link a {
            color: #8D6E63;
            font-size: 13px;
            text-decoration: none;
        }
        .forgot-link a:hover {
            color: #FF8A80;
            text-decoration: underline;
        }
        .flash {
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .flash-success {
            background: #B5EAD7;
            color: #2D6A4F;
        }
        .flash-danger {
            background: #FFB5B5;
            color: #8D3B3B;
        }
        .flash-warning {
            background: #FFE5A3;
            color: #8D6E00;
        }
        .flash-info {
            background: #A8D8EA;
            color: #1A4A5A;
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
                width: 92%;
                margin: 0 10px;
            }
            .login-box h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🐱 小鱼干记账本</h1>
        <div class="subtitle">🌸 登录继续记账</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>📧 邮箱</label>
                <input type="email" name="email" placeholder="请输入邮箱地址" required>
            </div>
            <div class="form-group">
                <label>🔒 密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="forgot-link">
                <a href="/forgot_password">🔑 忘记密码？</a>
            </div>
            <button type="submit" class="btn">🎀 登录</button>
        </form>

        <div class="register-link">
            还没有账号？ <a href="/register">注册一个</a>
        </div>
    </div>
</body>
</html>
