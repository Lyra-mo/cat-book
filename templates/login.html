<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 登录 - 小鱼干记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #FFF5ED;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .login-box h1 {
            font-size: 28px;
            color: #FF8A80;
            margin-bottom: 5px;
        }
        .login-box p {
            color: #8D6E63;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #5D4037;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #E8DDD5;
            border-radius: 10px;
            font-size: 14px;
            background: #FFF8F0;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #FF8A80;
            color: white;
            font-weight: bold;
        }
        .btn:hover {
            background: #FF6B5A;
        }
        .register-link {
            margin-top: 15px;
            font-size: 13px;
            color: #8D6E63;
        }
        .register-link a {
            color: #FF8A80;
            text-decoration: none;
            font-weight: bold;
        }
        .flash {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .flash-success { background: #B5EAD7; color: #2D6A4F; }
        .flash-danger { background: #FFB5B5; color: #8D3B3B; }
        .flash-warning { background: #FFE5A3; color: #8D6E00; }
        .flash-info { background: #A8D8EA; color: #1A4A5A; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🐱 小鱼干记账本</h1>
        <p>🌸 登录继续记账</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>📧 邮箱</label>
                <input type="email" name="email" placeholder="请输入邮箱地址" required>
            </div>
            <div class="form-group">
                <label>🔒 密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">🎀 登录</button>
        </form>

        <div class="register-link">
            还没有账号？ <a href="/register">注册一个</a>
        </div>
    </div>
</body>
</html>
