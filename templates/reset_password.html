<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 重置密码 - 小鱼干记账本</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive;
            background: #FFF5ED;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: white;
            border-radius: 28px;
            padding: 40px 36px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(255,138,128,0.12);
            text-align: center;
        }
        .box h1 { font-size: 26px; color: #FF8A80; margin-bottom: 6px; }
        .box p { color: #8D6E63; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display:block; font-size:14px; color:#5D4037; margin-bottom:4px; }
        .form-group input {
            width:100%; padding:10px 14px; border:2px solid #E8DDD5; border-radius:16px;
            font-size:15px; background:#FFF8F0;
        }
        .btn {
            width:100%; padding:12px; border:none; border-radius:50px;
            font-size:17px; background:#B5EAD7; color:#2D6A4F; font-weight:bold;
            cursor:pointer;
        }
        .btn:hover { background:#8DD4BA; }
        .flash { padding:10px; border-radius:12px; margin-bottom:15px; font-size:14px; }
        .flash-success { background:#B5EAD7; color:#2D6A4F; }
        .flash-danger { background:#FFB5B5; color:#8D3B3B; }
        .flash-warning { background:#FFE5A3; color:#8D6E00; }
        .flash-info { background:#A8D8EA; color:#1A4A5A; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔑 重置密码</h1>
        <p>设置新密码（至少4个字符）</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>🔒 新密码</label>
                <input type="password" name="password" placeholder="至少4位" required>
            </div>
            <div class="form-group">
                <label>🔒 确认密码</label>
                <input type="password" name="confirm_password" placeholder="再次输入" required>
            </div>
            <button type="submit" class="btn">🎀 重置密码</button>
        </form>

        <div class="link" style="margin-top:16px; font-size:14px; color:#8D6E63;">
            <a href="/login" style="color:#FF8A80; text-decoration:none;">← 返回登录</a>
        </div>
    </div>
</body>
</html>
